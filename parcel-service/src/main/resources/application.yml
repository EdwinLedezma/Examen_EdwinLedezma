server:
  port: 8081
  error:
    include-message: never
    include-stacktrace: never
spring:
  application:
    name: parcel-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/parcels}
    username: ${DB_USER:huertos}
    password: ${DB_PASSWORD:huertos_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-numbers-for-enums: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
services:
  parcels: ${PARCEL_URL:http://localhost:8081}
  monitoring: ${MONITORING_URL:http://localhost:8082}
