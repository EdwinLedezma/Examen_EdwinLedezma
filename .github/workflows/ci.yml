name: Verificar examen

on:
  push:
    branches: [main, develop, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compilar y ejecutar pruebas
        run: mvn -B clean verify
      - name: Validar Docker Compose
        run: docker compose config --quiet
      - name: Construir e iniciar los contenedores
        run: docker compose up --build -d
      - name: Esperar las aplicaciones
        run: python scripts/wait_for_services.py
      - name: Probar API con PostgreSQL
        run: python scripts/smoke_test.py
      - name: Mostrar logs si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Detener contenedores
        if: always()
        run: docker compose down -v
